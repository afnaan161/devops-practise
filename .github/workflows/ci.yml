name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .

      - name: Smoke test
        run: |
          docker run -d -p 8080:8080 --name t myapp:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080/health
